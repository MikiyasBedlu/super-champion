# /etc/nginx/sites-available/superchampion — run certbot after the first reload
server {
  listen 80;
  server_name superchampion.et www.superchampion.et;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl http2;
  server_name superchampion.et www.superchampion.et;
  ssl_certificate     /etc/letsencrypt/live/superchampion.et/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/superchampion.et/privkey.pem;
  client_max_body_size 1m;

  location /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_cache_valid 200 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }
}
